name: Setup canonical test runtimes
description: Resolve the shared test contract without duplicating product/package pins
runs:
  using: composite
  steps:
    - name: Resolve test environment
      id: contract
      shell: bash
      working-directory: ${{ github.workspace }}
      run: node scripts/ci/test-environment.mjs --github-output
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ steps.contract.outputs.node }}
    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: ${{ steps.contract.outputs.pnpm }}
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.contract.outputs.bun }}
