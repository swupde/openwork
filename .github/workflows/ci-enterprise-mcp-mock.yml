name: Enterprise MCP Mock

on:
  pull_request:
    paths:
      - "packages/enterprise-mcp-mock-server/**"
      - "ee/apps/enterprise-mock-lab/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-enterprise-mcp-mock.yml"
      - ".github/actions/setup-test-runtimes/**"
      - "scripts/ci/test-environment.*"
      - "constants.json"
  push:
    branches: [dev]
    paths:
      - "packages/enterprise-mcp-mock-server/**"
      - "ee/apps/enterprise-mock-lab/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-enterprise-mcp-mock.yml"
      - ".github/actions/setup-test-runtimes/**"
      - "scripts/ci/test-environment.*"
      - "constants.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Contracts, protocol, security, and lab
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup canonical test runtimes
        uses: ./.github/actions/setup-test-runtimes

      - name: Install focused dependencies
        run: >-
          pnpm install --frozen-lockfile --ignore-scripts
          --filter @openwork/enterprise-mcp-mock-server...
          --filter @openwork-ee/enterprise-mock-lab...

      - name: Check reusable mock package
        run: pnpm check:enterprise-mcp-mock-server

      - name: Check standalone mock lab
        run: pnpm check:enterprise-mock-lab
