extends: ./electron-builder.base.yml
appId: com.differentai.openwork
productName: OpenWork Cloud
extraMetadata:
  openworkDistribution: cloud
  openworkReleaseRepository: swupde/openwork
protocols:
  - name: OpenWork Cloud
    schemes:
      - openwork
publish:
  - provider: github
    owner: swupde
    repo: openwork
    releaseType: release
    channel: cloud
linux:
  executableName: openwork-cloud
artifactName: openwork-cloud-${os}-${arch}-${version}.${ext}
